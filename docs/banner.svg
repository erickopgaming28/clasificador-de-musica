<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f10"/>
      <stop offset="1" stop-color="#14261a"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ed760"/><stop offset="1" stop-color="#0b8f3f"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset="1" stop-color="#ffc371"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f5af0"/><stop offset="1" stop-color="#2cb67d"/></linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#4361ee"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <!-- ecualizador -->
  <g transform="translate(80 70)">
    <rect x="0" y="80" width="22" height="80" rx="11" fill="url(#a)"/>
    <rect x="34" y="30" width="22" height="130" rx="11" fill="url(#b)"/>
    <rect x="68" y="60" width="22" height="100" rx="11" fill="url(#c)"/>
    <rect x="102" y="10" width="22" height="150" rx="11" fill="url(#d)"/>
    <rect x="136" y="70" width="22" height="90" rx="11" fill="url(#a)"/>
  </g>
  <text x="290" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f2f2f2">Clasificador de Música</text>
  <text x="292" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#a1a1a8">Tu Spotify ordenado por género, estilo, ánimo, ocasión y época</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="292" y="220" width="120" height="36" rx="18" fill="#1ed760"/><text x="352" y="244" text-anchor="middle" fill="#062611">Género</text>
    <rect x="424" y="220" width="110" height="36" rx="18" fill="#222225"/><text x="479" y="244" text-anchor="middle" fill="#f2f2f2">Estilo</text>
    <rect x="546" y="220" width="110" height="36" rx="18" fill="#222225"/><text x="601" y="244" text-anchor="middle" fill="#f2f2f2">Ánimo</text>
    <rect x="668" y="220" width="120" height="36" rx="18" fill="#222225"/><text x="728" y="244" text-anchor="middle" fill="#f2f2f2">Ocasión</text>
    <rect x="800" y="220" width="100" height="36" rx="18" fill="#222225"/><text x="850" y="244" text-anchor="middle" fill="#f2f2f2">Época</text>
  </g>
</svg>
